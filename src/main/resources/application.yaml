spring:
  main:
    log-startup-info: false
    banner-mode: off
  datasource:
    url: jdbc:h2:file:./db/filmorate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
logging.level:
  root: INFO
  ru.yandex.practicum.filmorate: INFO

filmorate:
  top-by-likes-films-number: 10
